        async function apiCall(action, data = null) {
            if (!API_URL || API_URL.includes('PASTE_LINK_API')) {
                console.warn("API URL belum di set.");
                return { success: false, message: "URL API Belum Diatur" };
            }
            
            try {
                let url = API_URL + '?action=' + action;
                let options = { method: 'GET' };
                if (data) {
                    options = { method: 'POST', body: JSON.stringify(data), headers: { 'Content-Type': 'text/plain;charset=utf-8' } };
                }
                const response = await fetch(url, options);
                return await response.json();
            } catch (error) { 
                hideLoading();
                Swal.fire('Koneksi Gagal', 'Tidak dapat terhubung ke server Google Script.', 'error');
                if (action === 'getStudentsByClass') return [];
                return { success: false, message: "Koneksi ke server gagal." }; 
            }
        }

        function checkSSO() {
            document.getElementById('loadingOverlay').classList.remove('hidden');
            document.getElementById('loadingText').innerText = "Memverifikasi Akses Portal...";
            
            const savedUserStr = localStorage.getItem('siaga_user');
            const creds = localStorage.getItem('siaga_credentials');

            if (!savedUserStr) {
                handleMissingSession();
                return;
            }

            try {
                const savedUser = JSON.parse(savedUserStr);
                if (savedUser.role === 'siswa') {
                    currentUser = { role: 'SISWA', nama: savedUser.nama, kelas: savedUser.kelas };
                    initApp();
                    hideLoading();
                } else if (creds) {
                    const decoded = atob(creds);
                    const firstColon = decoded.indexOf(':');
                    const u = decoded.substring(0, firstColon);
                    const p = decoded.substring(firstColon + 1);
                    
                    apiCall('processLogin', {username: u, password: p}).then(res => {
                        if (res && res.success) {
                            currentUser = res.user;
                            initApp();
                            hideLoading();
                        } else {
                            localStorage.removeItem('siaga_user');
                            localStorage.removeItem('siaga_credentials');
                            handleMissingSession();
                        }
                    });
                } else {
                    handleMissingSession();
                }
            } catch(e) {
                handleMissingSession();
            }
        }

        function submitPresensiPiket(e) {
            e.preventDefault();
            const tgl = new Date().toISOString().split('T')[0];
            const dateObj = new Date(tgl);
            const namaHari = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'][dateObj.getDay()];
            const listGuru = JADWAL_PIKET[namaHari] || [];

            if (listGuru.length === 0) {
                return Swal.fire('Informasi', 'Tidak ada jadwal piket pada hari libur.', 'info');
            }

            const listPiket = listGuru.map((namaGuru, idx) => ({
                nama: namaGuru,
                status: document.getElementById(`piketStatus_${idx}`).value,
                keterangan: document.getElementById(`piketKet_${idx}`).value || '-'

        function submitKejadian(e) {

            let deskripsiFinal = "";
            let poinFinal = 0;

                const k = document.getElementById('kejadianKelas').value;

                if (!k || !n) return Swal.fire('Perhatian', 'Silakan pilih Kelas dan Nama Siswa terkait.', 'warning');
                if (!templateVal) return Swal.fire('Perhatian', 'Silakan pilih Jenis Pelanggaran/Penghargaan.', 'warning');

                if (templateVal === 'CUSTOM') {

                    if (!rincian) return Swal.fire('Perhatian', 'Isi rincian kejadian manual.', 'warning');

                    deskripsiFinal = `Siswa: ${n} (${k}) - Catatan: ${rincian} (Bobot: ${poinFinal} Poin)`;
                } else {
                    const listData = kategoriPilihan === 'Penghargaan' ? MASTER_PENGHARGAAN : MASTER_PELANGGARAN;
                    const item = listData.find(x => x.id == templateVal);
                    subKategoriFinal = `${item.teks} [${item.tingkat}]`;
                    const catatanTambahan = document.getElementById('kejadianCatatanTambahan').value.trim();
                    deskripsiFinal = `Siswa: ${n} (${k}) - ${kategoriPilihan === 'Penghargaan' ? 'Prestasi' : 'Pelanggaran'}: ${item.teks} (Bobot: ${item.poin} Poin)${catatanTambahan ? ' - Ket: ' + catatanTambahan : ''}`;
                }
            } else {
                subKategoriFinal = document.getElementById('kejadianSubKategoriGeneral').value;
                deskripsiFinal = document.getElementById('kejadianDeskripsiGeneral').value;
                poinFinal = 0;
            }

            // Tindak Lanjut
            const sanksiSelect = document.getElementById('kejadianTindakLanjutSelect').value;
            let tindakLanjutFinal = sanksiSelect;
            if (sanksiSelect === 'CUSTOM') {
                tindakLanjutFinal = document.getElementById('kejadianTindakLanjutCustom').value.trim();
            }
            if (!tindakLanjutFinal) return Swal.fire('Perhatian', 'Pilih atau tentukan tindakan/sanksi/apresiasi.', 'warning');

            const fileInput = document.getElementById('kejadianFile');
            const file = fileInput ? fileInput.files[0] : null;

            if (file && file.size > 10 * 1024 * 1024) { 
                Swal.fire('File Terlalu Besar', 'Maksimal ukuran file foto adalah 10 MB.', 'warning');
                return;
            }

            const payload = {
                tanggal: document.getElementById('kejadianTanggal').value,

                subKategori: subKategoriFinal, 
                deskripsi: deskripsiFinal,
                tindakLanjut: tindakLanjutFinal, 
                poin: poinFinal,
                penginput: currentUser.nama,
                fileData: null, fileName: null, fileMimeType: null
            };

            showLoading("Mengirim Laporan...");
            if (file) {
                const reader = new FileReader();

                    payload.fileData = event.target.result;
                    payload.fileName = file.name;
                    payload.fileMimeType = file.type;
                    sendKejadianApi(payload);
                };

        // =========================================================================
        // REKAPITULASI PELANGGARAN & POIN SISWA (TABEL & DRILL-DOWN MODAL)

        function parseStudentFromDesc(deskripsi) {
            // Format umum: "Siswa: NAMA SISWA (KELAS) - ..."
            if (!deskripsi) return { nama: 'Anonim', kelas: '-' };
            const match = deskripsi.match(/Siswa:\s*([^(]+)\s*\(([^)]+)\)/i);
            if (match) {
                return { nama: match[1].trim(), kelas: match[2].trim() };
            }
            return { nama: deskripsi.substring(0, 20), kelas: '-' };
        }

        function applyPelanggaranSiswaSummaryFilters() {
            if(!globalData.kejadian) return;
            const fKelas = document.getElementById('filterPelanggaranKelas') ? document.getElementById('filterPelanggaranKelas').value : '';
            const fSearch = document.getElementById('filterPelanggaranSearch') ? document.getElementById('filterPelanggaranSearch').value.toLowerCase() : '';

            // Ekstraksi & Pivot Semua Siswa dari kejadian & kehadiran
            const studentMap = {};

            // 1. Ekstraksi dari riwayat kejadian siswa
            globalData.kejadian.filter(d => d.kategori === 'Siswa').forEach(row => {
                const parsed = parseStudentFromDesc(row.deskripsi);
                const key = `${parsed.nama}___${parsed.kelas}`;
                if (!studentMap[key]) {
                    studentMap[key] = { nama: parsed.nama, kelas: parsed.kelas, ringan: 0, sedang: 0, berat: 0, penghargaan: 0, total: 0, list: [] };
                }

                const poinVal = parseInt(row.poin) || 0;
                const subTeks = (row.sub || '').toUpperCase();

                if (subTeks.includes('[PENGHARGAAN]') || subTeks.includes('[PRESTASI]')) {
                    studentMap[key].penghargaan += poinVal;
                    studentMap[key].total -= poinVal; // Penghargaan mengurangi beban poin pelanggaran
                } else if (subTeks.includes('[BERAT]')) {
                    studentMap[key].berat += poinVal;
                    studentMap[key].total += poinVal;
                } else if (subTeks.includes('[SEDANG]')) {
                    studentMap[key].sedang += poinVal;
                    studentMap[key].total += poinVal;
                } else {
                    studentMap[key].ringan += poinVal;
                    studentMap[key].total += poinVal;
                }

                studentMap[key].list.push(row);
            });

            // 2. Pastikan siswa dari tabel Kehadiran juga terdaftar meski belum punya pelanggaran
            if (globalData.kehadiran) {
                globalData.kehadiran.forEach(kh => {
                    const key = `${kh.nama}___${kh.kelas}`;
                    if (!studentMap[key]) {
                        studentMap[key] = { nama: kh.nama, kelas: kh.kelas, ringan: 0, sedang: 0, berat: 0, penghargaan: 0, total: 0, list: [] };
                    }
                });
            }

            pelanggaranSiswaSummaryData = Object.values(studentMap);

            if (currentUser.role === 'SISWA') {
                pelanggaranSiswaSummaryData = pelanggaranSiswaSummaryData.filter(d => d.nama.toLowerCase() === currentUser.nama.toLowerCase());
            } else {
                if (fKelas) pelanggaranSiswaSummaryData = pelanggaranSiswaSummaryData.filter(d => d.kelas === fKelas);
                if (fSearch) {
                    pelanggaranSiswaSummaryData = pelanggaranSiswaSummaryData.filter(d => d.nama.toLowerCase().includes(fSearch) || d.kelas.toLowerCase().includes(fSearch));
                }
            }

            executeSortPelanggaranSummary();
        }

        function sortPelanggaranSummary(col) {
            sortAscPoin = (sortColPoin === col) ? !sortAscPoin : true;
            sortColPoin = col;
            executeSortPelanggaranSummary();
        }

        function executeSortPelanggaranSummary() {
            pelanggaranSiswaSummaryData.sort((a, b) => {
                let valA = a[sortColPoin], valB = b[sortColPoin];
                if (typeof valA === 'string') return sortAscPoin ? valA.localeCompare(valB) : valB.localeCompare(valA);
                return sortAscPoin ? valA - valB : valB - valA;
            });

            const tbody = document.getElementById('rekapPelanggaranSummaryBody');
            if (!tbody) return;

            if (pelanggaranSiswaSummaryData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="p-8 text-center text-slate-500 font-medium bg-slate-50">Tidak ada data pelanggaran siswa yang cocok dengan filter.</td></tr>`;
                return;
            }

            let totalRingan = 0, totalSedang = 0, totalBerat = 0, totalKasus = 0;
            tbody.innerHTML = pelanggaranSiswaSummaryData.map((s, idx) => {
                totalRingan += s.ringan;
                totalSedang += s.sedang;
                totalBerat += s.berat;
                totalKasus += s.list.length;

                let badgeTotalClass = s.total <= 0 
                    ? 'bg-emerald-100 text-emerald-800' 
                    : (s.total <= 20 ? 'bg-yellow-100 text-yellow-800' : (s.total <= 50 ? 'bg-orange-100 text-orange-800' : 'bg-red-100 text-red-800'));

                return `
                    <tr class="hover:bg-indigo-50/50 border-b border-slate-100 transition-colors">
                        <td class="p-3 text-center text-slate-400 font-medium">${idx + 1}</td>
                        <td class="p-3 font-extrabold text-indigo-600 sticky-col bg-white">
                            <button onclick="openDetailSiswaModal('${s.nama.replace(/'/g, "\\'")}', '${s.kelas}')" class="text-left hover:text-indigo-800 hover:underline flex items-center space-x-1.5">
                                <span>${s.nama}</span>
                                <span class="text-[10px] bg-slate-100 text-slate-500 font-bold px-1.5 py-0.5 rounded">🔍 Rincian</span>
                            </button>
                        </td>
                        <td class="p-3"><span class="bg-slate-100 text-slate-600 px-2.5 py-1 rounded-lg text-xs font-bold">${s.kelas}</span></td>
                        <td class="p-3 text-center text-yellow-700 font-extrabold bg-yellow-50/30">${s.ringan}</td>
                        <td class="p-3 text-center text-orange-700 font-extrabold bg-orange-50/30">${s.sedang}</td>
                        <td class="p-3 text-center text-red-700 font-extrabold bg-red-50/30">${s.berat}</td>
                        <td class="p-3 text-center text-emerald-700 font-extrabold bg-emerald-50/30">${s.penghargaan > 0 ? '+' + s.penghargaan : '0'}</td>
                        <td class="p-3 text-center">
                            <span class="px-3 py-1 rounded-xl text-xs font-black ${badgeTotalClass}">${s.total} Poin</span>
                        </td>
                    </tr>`;
            }).join('');

            // Update KPI
            if (document.getElementById('kpiRingan')) document.getElementById('kpiRingan').innerText = totalRingan;
            if (document.getElementById('kpiSedang')) document.getElementById('kpiSedang').innerText = totalSedang;
            if (document.getElementById('kpiBerat')) document.getElementById('kpiBerat').innerText = totalBerat;
        }

        function openDetailSiswaModal(namaSiswa, kelasSiswa) {
            const modal = document.getElementById('detailSiswaModal');
            document.getElementById('modalSiswaNama').innerText = namaSiswa;
            document.getElementById('modalSiswaKelas').innerText = kelasSiswa;

            // Cari semua kejadian siswa
            const records = globalData.kejadian.filter(d => {
                if (d.kategori !== 'Siswa') return false;
                const p = parseStudentFromDesc(d.deskripsi);
                return p.nama.toLowerCase() === namaSiswa.toLowerCase();
            }).sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));

            let pRingan = 0, pSedang = 0, pBerat = 0, pApresiasi = 0, pTotal = 0;
            records.forEach(r => {
                const poinVal = parseInt(r.poin) || 0;
                const subTeks = (r.sub || '').toUpperCase();
                if (subTeks.includes('[PENGHARGAAN]') || subTeks.includes('[PRESTASI]')) {
                    pApresiasi += poinVal;
                    pTotal -= poinVal;

        function renderStudentDetailTable(myData = null) {
            if(!globalData.kehadiran) return;

            const fBulan = document.getElementById('siswaFilterBulan').value;
            if (fBulan) myData = myData.filter(d => d.tanggal && d.tanggal.split('-')[1] === fBulan);

            let counts = { H:0, S:0, I:0, A:0, T:0, total:0 };
            myData.forEach(row => {
                const stat = row.status ? row.status.toUpperCase() : '';
                if(['H', 'S', 'I', 'A', 'T'].includes(stat)) { counts[stat]++; counts.total++; }
            });

            const tbody = document.getElementById('siswaDetailBody');
            if(counts.total === 0) { tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-slate-500 font-medium">Tidak ada data kehadiran.</td></tr>`; return; }
            
            const persen = (((counts.H + counts.T) / counts.total) * 100).toFixed(1);

        }

        function applyPemantauanFilters() {
            if(!globalData.pemantauan) return;
            const fKelas = document.getElementById('filterPemantauanKelas').value;
            const fStatus = document.getElementById('filterPemantauanStatus').value;
            const fBulan = document.getElementById('filterPemantauanBulan').value;
            const fMulai = document.getElementById('filterPemantauanMulai') ? document.getElementById('filterPemantauanMulai').value : '';
            const fAkhir = document.getElementById('filterPemantauanAkhir') ? document.getElementById('filterPemantauanAkhir').value : '';
            const fSearch = document.getElementById('filterPemantauanSearch').value.toLowerCase();

            pemantauanFilteredData = globalData.pemantauan;
            if (fKelas) pemantauanFilteredData = pemantauanFilteredData.filter(d => d.kelas === fKelas);
            if (fStatus) pemantauanFilteredData = pemantauanFilteredData.filter(d => d.status === fStatus);
            if (fBulan) pemantauanFilteredData = pemantauanFilteredData.filter(d => d.tanggal && d.tanggal.split('-')[1] === fBulan);
            if (fMulai) pemantauanFilteredData = pemantauanFilteredData.filter(d => d.tanggal && new Date(d.tanggal) >= new Date(fMulai));
            if (fAkhir) pemantauanFilteredData = pemantauanFilteredData.filter(d => d.tanggal && new Date(d.tanggal) <= new Date(fAkhir));
            if (fSearch) pemantauanFilteredData = pemantauanFilteredData.filter(d => (d.guru && d.guru.toLowerCase().includes(fSearch)) || (d.mapel && d.mapel.toLowerCase().includes(fSearch)));

            let totalPantau = pemantauanFilteredData.length;
            let normalCount = 0, belumCount = 0, kosongCount = 0;

            pemantauanFilteredData.forEach(d => {
                if (d.status === 'Pembelajaran berlangsung dengan guru') normalCount++;
                else if (d.status === 'Guru belum / tidak berada di kelas') belumCount++;
                else if (d.status === 'Guru tidak hadir') kosongCount++;
            });

            if(document.getElementById('kpiPantauTotal')) document.getElementById('kpiPantauTotal').innerText = totalPantau;

        function renderTrenSemester() {
            if(!document.getElementById('view-trenSemester') || !globalData.kehadiran) return;
            const semester = document.getElementById('filterTrenSemester').value; 
            const fKelas = document.getElementById('filterTrenKelas').value;
            
            currentMonthsInfo = semester === 'GANJIL' 
                ? [ {m:'07', name:'Jul'}, {m:'08', name:'Agu'}, {m:'09', name:'Sep'}, {m:'10', name:'Okt'}, {m:'11', name:'Nov'}, {m:'12', name:'Des'} ]
                : [ {m:'01', name:'Jan'}, {m:'02', name:'Feb'}, {m:'03', name:'Mar'}, {m:'04', name:'Apr'}, {m:'05', name:'Mei'}, {m:'06', name:'Jun'} ];

            let tempData = globalData.kehadiran;
            if (fKelas) tempData = tempData.filter(d => d.kelas === fKelas);

            const pivot = {};
            tempData.forEach(row => {
                if(!row.tanggal) return;
                const month = row.tanggal.split('-')[1]; 
                if(!currentMonthsInfo.find(mo => mo.m === month)) return;
                if (!pivot[row.nama]) {
                    pivot[row.nama] = { nama: row.nama, kelas: row.kelas, months: {} };
                    currentMonthsInfo.forEach(mo => pivot[row.nama].months[mo.m] = { H:0, total:0 });
                }
                const stat = row.status ? row.status.toUpperCase() : '';
                if (['H', 'S', 'I', 'A', 'T'].includes(stat)) {
                    pivot[row.nama].months[month].total++;
                    if(['H', 'T'].includes(stat)) pivot[row.nama].months[month].H++; 
                }
            });

            trenSemesterData = Object.values(pivot).map(student => {
                let totalPersenAllMonths = 0, activeMonthsCount = 0;
                student.monthsPersen = {};
                currentMonthsInfo.forEach(mo => {
                    const dataMo = student.months[mo.m];
                    if (dataMo.total > 0) {
                        const persen = (dataMo.H / dataMo.total) * 100;
                        student.monthsPersen[mo.m] = persen; totalPersenAllMonths += persen; activeMonthsCount++;
                    } else { student.monthsPersen[mo.m] = -1; }
                });
                student.avg = activeMonthsCount > 0 ? (totalPersenAllMonths / activeMonthsCount) : -1;
                return student;
            });
            executeSortTren(); 
        }

        function executeSortTren() {
            const trHeader = document.getElementById('trenHeaderRow');
            if(!trHeader) return;
            let headerHTML = `<th class="p-3 font-bold cursor-pointer hover:bg-indigo-100 transition-colors" onclick="sortTren('nama')">Nama Siswa <span class="sort-icon">${sortColTren === 'nama' ? (sortAscTren ? '▲' : '▼') : ''}</span></th>

            currentMonthsInfo.forEach(mo => {

            headerHTML += `<th class="p-3 font-bold text-center bg-indigo-200 border-l border-indigo-300 cursor-pointer hover:bg-indigo-300 transition-colors" onclick="sortTren('avg')">Rata-rata <span class="sort-icon">${sortColTren === 'avg' ? (sortAscTren ? '▲' : '▼') : ''}</span></th>`;
            trHeader.innerHTML = headerHTML;

            trenSemesterData.sort((a, b) => {
                let valA = a[sortColTren], valB = b[sortColTren];
                if (sortColTren !== 'nama' && sortColTren !== 'kelas' && sortColTren !== 'avg') { valA = a.monthsPersen[sortColTren]; valB = b.monthsPersen[sortColTren]; }

                currentMonthsInfo.forEach(mo => {
                    const persen = student.monthsPersen[mo.m];
                    rowHTML += persen !== -1 ? `<td class="p-3 text-center font-extrabold border-l border-slate-100 ${persen>=80?'text-green-600':persen>=60?'text-yellow-600':'text-red-600'}">${persen.toFixed(1)}%</td>` : `<td class="p-3 text-center text-slate-300 border-l border-slate-100 font-medium">-</td>`;
                });
                rowHTML += student.avg !== -1 ? `<td class="p-3 text-center font-extrabold bg-indigo-50 border-l border-indigo-100 ${student.avg>=80?'text-indigo-700':student.avg>=60?'text-yellow-700':'text-red-700'}">${student.avg.toFixed(1)}%</td></tr>` : `<td class="p-3 text-center text-slate-400 bg-indigo-50 border-l border-indigo-100">-</td></tr>`;
                return rowHTML;
            }).join('');
        }

        function exportTableToExcel(tableId, filename) {
            const table = document.getElementById(tableId).cloneNode(true);
            table.querySelectorAll('.sort-icon').forEach(icon => icon.remove());
            const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"></head><body>${table.outerHTML}</body></html>`;
            const blob = new Blob(['\ufeff', html], { type: 'application/vnd.ms-excel' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `${filename}_${new Date().toISOString().slice(0,10)}.xls`;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }
