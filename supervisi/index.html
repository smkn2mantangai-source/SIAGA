<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SIAGA-SUPERVISI - Penjaminan Mutu Pembelajaran</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* */
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
    .shadow-soft { box-shadow: 0 10px 40px -10px rgba(0,0,0,0.05); }
    .glass-effect { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
    .toast { transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); transform: translateY(100%) scale(0.9); opacity: 0; }
    .toast.show { transform: translateY(0) scale(1); opacity: 1; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    
    .radio-switch input[type="radio"] { display: none; }
    .radio-switch label { display: block; padding: 10px 15px; text-align: center; border-radius: 8px; font-weight: 600; font-size: 13px; color: #64748b; background: #f1f5f9; cursor: pointer; transition: all 0.2s; }
    .radio-switch input[type="radio"]:checked + label { background: #4f46e5; color: white; box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3); }

    .score-pill input[type="radio"] { display: none; }
    .score-pill label { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 10px; font-weight: 800; font-size: 13px; color: #64748b; background: #f1f5f9; cursor: pointer; transition: all 0.2s; }
    .score-pill input[type="radio"]:checked + label { background: #4f46e5; color: white; box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3); }

    @media (min-width: 768px) {
      /* Sidebar Normal */
      #sidebar {
        width: 18rem !important;
        transform: translateX(0) !important;
        transition: width 0.3s ease, transform 0.3s ease;
      }

      /* Sidebar Minimize */
      #sidebar.sidebar-collapsed {
        width: 5rem !important;
        transform: translateX(0) !important;
      }

      /* Main layout bergeser mengikuti lebar sidebar */
      #main-layout {
        margin-left: 18rem;
        transition: margin-left 0.3s ease;
      }

      #main-layout.sidebar-main-collapsed {
        margin-left: 5rem;
      }

      /* Header Brand */
      #sidebar .sidebar-brand {
        transition: opacity 0.2s ease, width 0.3s ease;
        white-space: nowrap;
        overflow: hidden;
      }

      #sidebar.sidebar-collapsed .sidebar-brand {
        opacity: 0;
        width: 0;
      }

      #sidebar.sidebar-collapsed .sidebar-header {
        padding-left: 0.75rem;
        padding-right: 0.75rem;
        justify-content: center;
      }

      #sidebar.sidebar-collapsed .sidebar-toggle {
        display: none;
      }

      /* User Info */
      #sidebar .sidebar-user-info {
        transition: opacity 0.2s ease;
        overflow: hidden;
      }

      #sidebar.sidebar-collapsed .sidebar-user-info {
        opacity: 0;
        width: 0;
        pointer-events: none;
      }

      #sidebar.sidebar-collapsed .sidebar-user {
        justify-content: center;
      }

      #sidebar.sidebar-collapsed .sidebar-user-container {
        padding-left: 0.5rem;
        padding-right: 0.5rem;
      }

      /* Menu Items */
      #sidebar .sidebar-menu-label {
        display: inline-block;
        opacity: 1;
        max-width: 200px;
        overflow: hidden;
        white-space: nowrap;
        transition: opacity 0.2s ease, max-width 0.3s ease;
      }

      #sidebar.sidebar-collapsed .sidebar-menu-label {
        opacity: 0;
        max-width: 0;
        pointer-events: none;
      }

      #sidebar.sidebar-collapsed .sidebar-menu-item {
        justify-content: center;
        padding-left: 0.75rem;
        padding-right: 0.75rem;
      }

      #sidebar.sidebar-collapsed .sidebar-menu-item i {
        margin: 0 !important;
      }

      /* Logout Button */
      #sidebar .logout-label {
        display: inline-block;
        white-space: nowrap;
        overflow: hidden;
      }

      #sidebar.sidebar-collapsed .logout-label {
        display: none;
      }

      #sidebar.sidebar-collapsed .logout-button {
        display: flex;
        justify-content: center;
        align-items: center;
        padding-left: 0;
        padding-right: 0;
      }

      #sidebar.sidebar-collapsed .logout-button i {
        margin: 0 !important;
      }
    }

    @page {
      size: A4 portrait;
      margin: 12mm;
    }

    @media print {
      html, body {
        width: 210mm !important;
        height: auto !important;
        min-height: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: visible !important;
        background: #ffffff !important;
      }

      body * {
        visibility: hidden !important;
      }

      #modal-laporan,
      #modal-laporan *,
      #printable-report,
      #printable-report * {
        visibility: visible !important;
      }

      #modal-laporan {
        position: static !important;
        display: block !important;
        inset: auto !important;
        width: 100% !important;
        height: auto !important;
        min-height: 0 !important;
        max-height: none !important;
        overflow: visible !important;
        background: #ffffff !important;
        padding: 0 !important;
        margin: 0 !important;
      }

      #modal-laporan > div {
        position: static !important;
        display: block !important;
        width: 100% !important;
        max-width: none !important;
        height: auto !important;
        min-height: 0 !important;
        max-height: none !important;
        overflow: visible !important;
        padding: 0 !important;
        margin: 0 !important;
        box-shadow: none !important;
        border-radius: 0 !important;
      }

      #printable-report {
        position: static !important;
        display: block !important;
        width: 100% !important;
        max-width: none !important;
        height: auto !important;
        max-height: none !important;
        overflow: visible !important;
        padding: 0 !important;
        margin: 0 !important;
        font-size: 10pt !important;
        line-height: 1.35 !important;
      }

      .no-print {
        display: none !important;
      }

      table {
        width: 100% !important;
        border-collapse: collapse !important;
      }

      thead {
        display: table-header-group !important;
      }

      tfoot {
        display: table-footer-group !important;
      }

      tr {
        break-inside: avoid !important;
        page-break-inside: avoid !important;
      }

      h2, h3, h4 {
        break-after: avoid !important;
        page-break-after: avoid !important;
      }

      .print-page-break {
        break-before: page !important;
        page-break-before: always !important;
      }

      .print-signature {
        break-inside: avoid !important;
        page-break-inside: avoid !important;
      }
    }
  </style>
</head>
<body class="text-slate-800 antialiased h-screen overflow-hidden flex flex-col">

  <div id="toast-container" class="fixed bottom-5 right-5 z-[9999] flex flex-col gap-3 pointer-events-none"></div>

  <div id="modal-upload" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[9999] flex items-center justify-center p-4">

            <option value="Program Tahunan">Program Tahunan</option>
            <option value="Program Semester">Program Semester</option>
            <option value="Modul Ajar / RPP">Modul Ajar / RPP</option>

        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Nama Spesifik (Opsional)</label>

        </div>

          <p class="text-[10px] text-slate-500 mt-1">Maks. 5MB. Dokumen akan tersimpan otomatis di Google Drive.</p>
        </div>

        <button type="submit" id="btn-upload" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg mt-4">Simpan Dokumen</button>
      </form>
    </div>
  </div>

  <div id="modal-jadwal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[9999] flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-[2rem] p-6 md:p-8 shadow-2xl">
      <div class="flex justify-between items-center mb-6">
        <h3 class="font-extrabold text-xl text-slate-800">Ajukan Jadwal</h3>
        <button onclick="closeModal('modal-jadwal')" class="w-8 h-8 bg-slate-100 text-slate-500 rounded-full hover:bg-slate-200"><i class="fa-solid fa-xmark"></i></button>

          <select id="jadwal-supervisor" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-100 outline-none font-bold text-sm">

        </div>
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Tautkan RPP / Modul Ajar (Dari Portofolio)</label>
          <select id="jadwal-rpp" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-100 outline-none font-bold text-sm">

          </select>
        </div>
        <div class="flex gap-4">
          <div class="w-1/2">

            <input type="date" id="jadwal-tanggal" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-100 outline-none font-bold text-sm">

            <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Mata Pelajaran</label>

        <button type="submit" id="btn-jadwal" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl transition mt-4"><i class="fa-regular fa-calendar-check mr-2"></i> Konfirmasi Jadwal</button>
      </form>
    </div>

  <div id="modal-laporan" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[9999] flex items-start justify-center p-2 md:p-6 overflow-y-auto">
    <div class="bg-white w-full max-w-4xl rounded-3xl p-6 md:p-10 shadow-2xl relative my-6">
      <div class="flex justify-between items-center mb-6 no-print border-b pb-4">
        <h3 class="font-extrabold text-xl text-slate-800"><i class="fa-solid fa-file-contract text-indigo-600 mr-2"></i> Laporan Hasil Supervisi Akademik</h3>
        <div class="flex gap-2">
          <button onclick="cetakLaporanSupervisi()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2.5 rounded-xl text-xs flex items-center gap-2 shadow-md transition"><i class="fa-solid fa-print"></i> Cetak Laporan</button>
          <button onclick="cetakLaporanSupervisi()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2.5 rounded-xl text-xs flex items-center gap-2 shadow-md transition"><i class="fa-solid fa-file-pdf"></i> Simpan PDF</button>
          <button onclick="closeModal('modal-laporan')" class="w-9 h-9 bg-slate-100 text-slate-500 rounded-full hover:bg-slate-200"><i class="fa-solid fa-xmark"></i></button>

      <div id="printable-report" class="space-y-6 text-slate-800 text-xs md:text-sm">

      </div>

  </div>

  <div id="app-view" class="hidden flex h-screen w-full bg-slate-50">
    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/50 z-20 hidden md:hidden"></div>

    <aside id="sidebar" class="fixed inset-y-0 left-0 transform -translate-x-full md:translate-x-0 z-30 bg-white border-r border-slate-200 flex flex-col shadow-soft h-full">
      <div class="sidebar-header h-20 flex items-center px-6 border-b border-slate-100 justify-between">
        <div class="flex items-center gap-3 overflow-hidden">
          <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shrink-0">
            <i class="fa-solid fa-leaf text-white"></i>
          </div>
          <span class="sidebar-brand font-extrabold text-xl text-slate-800">SIAGA</span>
        </div>
        <button onclick="toggleSidebar()" class="sidebar-toggle text-slate-400 hover:text-slate-700 p-2 rounded-lg hover:bg-slate-100" title="Minimalkan Menu">
          <i class="fa-solid fa-bars text-xl"></i>
        </button>
      </div>

      <div class="sidebar-user-container p-6 border-b border-slate-100">
        <div class="sidebar-user flex items-center gap-4">
          <div class="w-12 h-12 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold text-xl shrink-0" id="user-initial">A</div>
          <div class="sidebar-user-info overflow-hidden">
            <h3 class="font-bold text-slate-800 text-sm truncate" id="user-name">Nama</h3>
            <p class="text-[10px] text-slate-500 font-bold bg-slate-100 inline-block px-2 py-0.5 rounded-md mt-1" id="user-role">Role</p>

  <script>
    const API_URL = 'SUPABASE';
    window.supervisiDb=supabase.createClient('https://wmirlnrreqypgljvgojz.supabase.co','sb_publishable_UPh63Vm1KlwwVYyBuAjM8A_YvkFXn4p');

    let currentUser = null;
    let listPendidik = [];
    let stateSiklus = null; 
    let masterRubrikPerencanaan = [];
    let masterRubrikObservasi = [];

    const UI = {
      showToast: (msg, type = 'success') => {
        const c = document.getElementById('toast-container');
        const t = document.createElement('div');
        t.className = `toast flex items-center gap-3 bg-white p-4 rounded-2xl shadow-xl border border-slate-100 min-w-[280px]`;
        t.innerHTML = `<div class="w-10 h-10 rounded-xl ${type==='success'?'bg-emerald-500':'bg-red-500'} flex justify-center items-center"><i class="fa-solid ${type==='success'?'fa-check':'fa-triangle-exclamation'} text-white"></i></div><p class="font-bold text-slate-700 text-sm">${msg}</p>`;
        c.appendChild(t);
        setTimeout(() => t.classList.add('show'), 50);
        setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3500);
      }
    };

    /* SSO Integration Functions */
    window.addEventListener('DOMContentLoaded', () => {
      checkSSO();
    });

    function handleMissingSession() {
        document.body.innerHTML = `
            <div class="h-screen w-full flex items-center justify-center bg-slate-50 p-4">
                <div class="bg-white p-8 rounded-3xl shadow-xl border border-slate-100 max-w-md text-center">
                    <div class="w-16 h-16 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <h2 class="text-xl font-bold text-slate-800 mb-2">Akses Ditolak</h2>
                    <p class="text-sm text-slate-500 mb-6">Sistem mendeteksi tidak ada sesi yang aktif atau Anda (Siswa) tidak memiliki izin. Silakan login melalui Portal Utama SIAGA.</p>
                    <button onclick="backToPortal()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl w-full transition-colors shadow-md">
                        Kembali ke Portal Utama
                    </button>
                </div>
            </div>
        `;
    }

    function backToPortal() {
        try {
            if (window.location.protocol === 'blob:' || window.location.protocol === 'about:') {
                UI.showToast('Mode Preview. Anda akan dilempar ke ../index.html', 'info');
            } else {
                window.location.href = '../index.html';
            }
        } catch (e) {
            UI.showToast('Kembali ke Portal Utama', 'info');
        }
    }

    async function checkSSO() {
        const savedUserStr = localStorage.getItem('siaga_user');
        const creds = localStorage.getItem('siaga_credentials');

        if (!savedUserStr) {
            handleMissingSession();
            return;
        }

        try {
            const savedUser = JSON.parse(savedUserStr);
            if (savedUser.role === 'siswa') {
                // Modul Supervisi murni untuk manajemen/guru
                handleMissingSession();
            } else {
                const res = await fetchAPI('getCurrentUser', {});
                
                if (res && res.status === 'success') {
                    currentUser = res.user;
                    initApp();
                } else {
                    localStorage.removeItem('siaga_user');
                    localStorage.removeItem('siaga_credentials');
                    handleMissingSession();
                }
            }
        } catch(e) {
            handleMissingSession();
        }
    }

    function logout() { 
        window.supervisiDb.auth.signOut();
        localStorage.removeItem('siaga_user');
        localStorage.removeItem('siaga_credentials');
        backToPortal();
    }

    /* Core UI Toggles */
    function toggleSidebar() { 
      const sidebar = document.getElementById('sidebar');
      const main = document.getElementById('main-layout');
      const overlay = document.getElementById('sidebar-overlay');

      if (window.innerWidth >= 768) {
        sidebar.classList.toggle('sidebar-collapsed');
        main.classList.toggle('sidebar-main-collapsed');
        return;
      }

      sidebar.classList.toggle('-translate-x-full');
      overlay.classList.toggle('hidden');
    }
    
    function closeMobileSidebar() { 
      if (window.innerWidth < 768) { 
        const s = document.getElementById('sidebar'); 
        if (!s.classList.contains('-translate-x-full')) {
          toggleSidebar(); 
        }
      } 
    }

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    function toggleUploadUI() {
      const isFile = document.getElementById('tipe_file').checked;
      document.getElementById('input-container-file').classList.toggle('hidden', !isFile);
      document.getElementById('input-container-link').classList.toggle('hidden', isFile);

        return {status:'error'};

    async function handleUploadDokumen(e) {
      e.preventDefault();
      const tipe = document.querySelector('input[name="upload-tipe"]:checked').value;
      const overlay = document.getElementById('upload-overlay');
      
      let payload = {
        username: currentUser.username,
        kategori: document.getElementById('upload-kategori').value,
        nama: document.getElementById('upload-nama').value,
        tipe: tipe, url: ''
      };

      overlay.classList.remove('hidden');

      if (tipe === 'link') {
        payload.url = document.getElementById('upload-url').value;
        kirimUploadData(payload);
      } else {
        const fileInput = document.getElementById('upload-file');
        const file = fileInput.files[0];
        if(!file) { UI.showToast("Pilih file dulu!", "error"); overlay.classList.add('hidden'); return; }
        if(file.size > 5 * 1024 * 1024) { UI.showToast("Maksimal 5MB", "error"); overlay.classList.add('hidden'); return; }
        
        const reader = new FileReader();
        reader.onload = function(evt) {
          payload.fileData = evt.target.result.split(',')[1];
          payload.fileName = file.name;
          payload.fileMimeType = file.type;
          kirimUploadData(payload);
        };
        reader.readAsDataURL(file);
      }
    }

    async function kirimUploadData(payload) {
      const res = await fetchAPI('saveDokumen', payload);
      document.getElementById('upload-overlay').classList.add('hidden');
      if(res.status === 'success') {
        closeModal('modal-upload');
        document.getElementById('form-upload').reset();
        UI.showToast('Berhasil diunggah!');
        renderPortofolio(currentUser.username, true);
      } else {
        UI.showToast(res.message, 'error');
      }
    }

    async function bukaSiklus(data, isGuru, isSup) {
      stateSiklus = { 
        data: data, 
        isGuru: isGuru, 
        isSup: isSup, 
        activeTab: data.fase === 'Selesai' ? 'Pasca' : data.fase,
        detailScores: {}
      };

      const resDetail = await fetchAPI('getDetailPenilaian', { idPendampingan: data.id });
      if(resDetail.status === 'success' && resDetail.data) {
        resDetail.data.forEach(item => {
          stateSiklus.detailScores[item.idKriteria] = { skor: item.skor, catatan: item.catatan };
        });
      }

      renderInstrumenDetail();
    }

    function updateRubrikScore(idKriteria, skorVal) {
      if(!stateSiklus.detailScores[idKriteria]) stateSiklus.detailScores[idKriteria] = {};
      stateSiklus.detailScores[idKriteria].skor = skorVal;
    }

    function updateRubrikCatatan(idKriteria, catatanVal) {
      if(!stateSiklus.detailScores[idKriteria]) stateSiklus.detailScores[idKriteria] = {};
      stateSiklus.detailScores[idKriteria].catatan = catatanVal;
    }

    function hitungTotalObservasi() {
      let total = 0;
      masterRubrikObservasi.forEach(r => {
        let sc = stateSiklus.detailScores[r.id];
        if(sc && sc.skor) total += parseInt(sc.skor);
      });
      let lblTotal = document.getElementById('lbl-total-skor');
      let lblKat = document.getElementById('lbl-kategori');
      if(lblTotal) lblTotal.innerText = total;
      
      let persen = Math.round((total / 60) * 100);
      let kat = 'Perlu Perbaikan';
      if(total >= 51) kat = 'Sangat Baik';
      else if(total >= 39) kat = 'Baik';
      else if(total >= 27) kat = 'Cukup';

      if(lblKat) lblKat.innerText = `${kat} (${persen}%)`;
    }

    async function simpanPenilaianRubrik(jenis) {
      const targetRubrik = jenis === 'Perencanaan' ? masterRubrikPerencanaan : masterRubrikObservasi;
      let unassigned = [];
      let items = [];

      targetRubrik.forEach(r => {
        let scoreData = stateSiklus.detailScores[r.id];
        if(!scoreData || !scoreData.skor || parseInt(scoreData.skor) === 0) {
          unassigned.push(r.id);
        } else {
          items.push({ idKriteria: r.id, skor: scoreData.skor, catatan: scoreData.catatan || '' });
        }
      });

      if (unassigned.length > 0) {
        UI.showToast(`Penilaian Belum Lengkap! Ada ${unassigned.length} indikator (${unassigned.join(', ')}) yang belum dinilai.`, "error");
        return;
      }

      UI.showToast(`Memproses & menyimpan penilaian ${jenis}...`);
      const btn = document.getElementById(jenis === 'Perencanaan' ? 'btn-save-rpp' : 'btn-save-obs-rubrik');
      if(btn) { btn.disabled = true; btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Menyimpan...`; }

      const res = await fetchAPI('saveDetailPenilaian', { idPendampingan: stateSiklus.data.id, items: items });
      
      if(btn) { btn.disabled = false; btn.innerHTML = `<i class="fa-solid fa-floppy-disk mr-1"></i> Simpan Penilaian ${jenis === 'Perencanaan' ? 'RPP' : 'Observasi'}`; }

      if(res.status === 'success') {
        UI.showToast(`Penilaian ${jenis} Berhasil Disimpan!`);
      } else UI.showToast(res.message, 'error');
    }

    async function simpanFase(fase) {
      let payload = { id: stateSiklus.data.id, fase: fase };
      let btnId = fase === 'Pra' ? 'btn-save-pra' : (fase === 'Obs' ? 'btn-save-obs-notes' : 'btn-save-pasca');
      const btn = document.getElementById(btnId);
      
      if(fase === 'Pra') { payload.tujuan = document.getElementById('pra-tujuan').value; payload.fokus = document.getElementById('pra-fokus').value; stateSiklus.data.praTujuan = payload.tujuan; stateSiklus.data.praFokus = payload.fokus; } 
      else if (fase === 'Obs') { payload.catatan = document.getElementById('obs-catatan').value; stateSiklus.data.obsCatatan = payload.catatan; } 
      else if (fase === 'Pasca') { payload.refleksi = document.getElementById('pasca-refleksi').value; stateSiklus.data.pascaRefleksi = payload.refleksi; }

      UI.showToast(`Memproses & menyimpan data ${fase}...`);
      if(btn) { btn.disabled = true; btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Menyimpan...`; }

      const res = await fetchAPI('updateFase', payload);
      
      if(res.status === 'success') {
        UI.showToast('Data berhasil disimpan!');
        if(fase === 'Pra') stateSiklus.activeTab = 'Obs';
        if(fase === 'Obs') stateSiklus.activeTab = 'Pasca';
        renderInstrumenDetail();
      } else {
        UI.showToast(res.message || 'Gagal menyimpan', 'error');
        if(btn) { btn.disabled = false; btn.innerHTML = `Simpan Data`; }
      }
    }

                <td class="border border-slate-300 p-2 font-bold">1. Perencanaan Pembelajaran (RPP/Modul)</td>
                <td class="border border-slate-300 p-2 text-center font-extrabold">${totalP} / 60</td>
                <td class="border border-slate-300 p-2 text-center font-bold">${persenP}%</td>
                <td class="border border-slate-300 p-2 text-center font-bold">${getKat(totalP)}</td>
              </tr>
              <tr>
                <td class="border border-slate-300 p-2 font-bold">2. Observasi Pembelajaran Kelas</td>
                <td class="border border-slate-300 p-2 text-center font-extrabold">${totalO} / 60</td>
                <td class="border border-slate-300 p-2 text-center font-bold">${persenO}%</td>
                <td class="border border-slate-300 p-2 text-center font-bold">${getKat(totalO)}</td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Signatures -->
        <div class="print-signature pt-8 flex justify-between text-center text-xs font-bold">
          <div class="w-2/5">
            <p>Guru Yang Disupervisi</p>
            <div class="h-20"></div>
            <p class="underline">${jData ? jData.namaGuru : '____________________'}</p>
          </div>
          <div class="w-2/5">
            <p>Supervisor / Observer</p>
            <div class="h-20"></div>
            <p class="underline">${jData ? jData.namaSupervisor : '____________________'}</p>
          </div>
        </div>
      `;
    }

    function cetakLaporanSupervisi() {
      window.print();
    }

    function bukaDiskusi(idDok, judul, isOwn) {
      const existing = document.getElementById('modal-diskusi');
      if(existing) existing.remove();

      const role = currentUser.role || '';
      const isWewenang = ['Kepsek', 'Kepala Sekolah', 'Waka_Kurikulum', 'Waka Kurikulum', 'Pengawas'].includes(role);
      
      let actionHtml = '';
      if (isWewenang) {
        actionHtml = `
          <div class="flex flex-wrap gap-2 p-3 bg-indigo-50 border-b border-indigo-100 justify-between items-center shrink-0">
            <span class="text-[10px] font-extrabold text-indigo-800 uppercase tracking-wide"><i class="fa-solid fa-shield-halved mr-1"></i> Aksi Supervisor:</span>
            <div class="flex gap-2">
              <button onclick="ubahStatusDok('${idDok}', 'Perlu Revisi')" class="bg-amber-100 hover:bg-amber-200 text-amber-700 text-[10px] font-bold px-3 py-1.5 rounded-lg transition border border-amber-200">Minta Revisi</button>
              <button onclick="ubahStatusDok('${idDok}', 'Disetujui')" class="bg-emerald-100 hover:bg-emerald-200 text-emerald-700 text-[10px] font-bold px-3 py-1.5 rounded-lg transition border border-emerald-200">Setujui Dokumen</button>
            </div>
          </div>
        `;
      }

      const modal = document.createElement('div');
      modal.id = 'modal-diskusi';
      modal.className = 'fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[9999] flex items-center justify-center p-4';
      modal.innerHTML = `
        <div class="bg-white w-full max-w-lg rounded-[2rem] shadow-2xl flex flex-col h-[85vh] md:h-[80vh] overflow-hidden">
          <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50 shrink-0">
            <h3 class="font-extrabold text-slate-800 text-sm truncate">Diskusi: ${judul}</h3>
            <button onclick="document.getElementById('modal-diskusi').remove()" class="w-8 h-8 rounded-full bg-white shadow-sm flex justify-center items-center hover:bg-slate-200"><i class="fa-solid fa-xmark"></i></button>
          </div>
          ${actionHtml}
          <div id="chat-area" class="flex-1 overflow-y-auto p-5 bg-slate-50/50 flex flex-col gap-3"><div class="text-center text-slate-400"><i class="fa-solid fa-circle-notch fa-spin"></i></div></div>
          <div class="p-4 bg-white border-t border-slate-100 shrink-0">
            <form onsubmit="kirimKomentarDokumen(event, '${idDok}')" class="flex gap-2">
              <input type="text" id="chat-input" required class="flex-1 bg-slate-100 rounded-xl px-4 py-3 outline-none font-medium text-sm" placeholder="Ketik balasan...">
              <button type="submit" class="bg-indigo-600 text-white w-12 rounded-xl flex justify-center items-center"><i class="fa-solid fa-paper-plane"></i></button>
            </form>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
      fetchAPI('getDiskusi', {idDok: idDok}).then(res => { if(res.status === 'success') renderChatDokumen(res.data); });
    }

    async function ubahStatusDok(idDok, status) {
      const res = await fetchAPI('updateStatusDokumen', { idDok: idDok, status: status });
      if(res.status === 'success') {
        UI.showToast(`Status diubah: ${status}`);
        const tUsr = document.getElementById('pilih-guru-telaah') ? document.getElementById('pilih-guru-telaah').value : currentUser.username;
        renderPortofolio(tUsr, (tUsr === currentUser.username));
        
        const modalDiskusi = document.getElementById('modal-diskusi');
        if(modalDiskusi) modalDiskusi.remove();
      }
    }

    function renderChatDokumen(chats) {
      const area = document.getElementById('chat-area');
      if(chats.length === 0) { area.innerHTML = `<p class="text-center text-xs text-slate-400 font-bold mt-5">Belum ada diskusi.</p>`; return; }
      let html = '';
      chats.forEach(c => {
        const isMe = c.pengirim === currentUser.nama;
        html += `<div class="max-w-[85%] p-3 rounded-2xl ${isMe ? 'self-end bg-indigo-600 text-white' : 'self-start bg-white border border-slate-200 text-slate-700'} shadow-sm">
            <p class="text-[9px] font-bold ${isMe ? 'text-indigo-200' : 'text-slate-400'} mb-1">${c.pengirim}</p>
            <p class="text-sm font-medium leading-relaxed">${c.pesan}</p>
          </div>`;
      });
      area.innerHTML = html; area.scrollTop = area.scrollHeight;
    }

    async function kirimKomentarDokumen(e, idDok) {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const pesan = input.value; input.value = '';
      const res = await fetchAPI('kirimKomentar', { idDok: idDok, nama: currentUser.nama, role: currentUser.role, pesan: pesan });
      if(res.status === 'success') renderChatDokumen(res.data);
    }
  </script>
  <script src="./supabase-api.js"></script>
</body>
</html>
